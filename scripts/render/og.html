<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face { font-family: Archivo; src: url(/src/app/fonts/archivo-wdth.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Plex; src: url(/src/app/fonts/plex-mono-400.woff2) format('woff2'); }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; background: radial-gradient(circle at 78% 45%, #24272c 0%, #0e0f11 62%); color: #f3f0ea; font-family: Archivo; overflow: hidden; position: relative; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255/.035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255/.035) 1px, transparent 1px); background-size: 50px 50px; }
img { position: absolute; right: -90px; top: 40px; width: 720px; }
.wrap { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 620px; display: flex; flex-direction: column; justify-content: space-between; }
.mark { display: flex; align-items: center; gap: 16px; }
.mark b { font-size: 34px; font-weight: 820; font-stretch: 125%; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1; }
.mark span { display: block; font-family: Plex; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: #b5b2ab; margin-top: 6px; }
h1 { font-size: 70px; line-height: .96; font-weight: 720; font-stretch: 112%; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: #b5b2ab; }
.meta { white-space: nowrap; font-family: Plex; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #cfcbc3; display: flex; gap: 14px; align-items: center; }
.meta i { width: 10px; height: 10px; background: #ffd100; display: inline-block; }
</style></head>
<body>
<div class="grid"></div>
<img src="/public/media/brake-assembly.png" alt="">
<div class="wrap">
  <div class="mark">
    <svg width="52" height="52" viewBox="0 0 32 32"><rect width="32" height="32" rx="3" fill="#FFD100"/><circle cx="16" cy="16" r="7.2" fill="none" stroke="#0E0F11" stroke-width="1.8"/><path d="M16 4.5v5.2M16 22.3v5.2M4.5 16h5.2M22.3 16h5.2" stroke="#0E0F11" stroke-width="1.8"/><circle cx="16" cy="16" r="1.9" fill="#0E0F11"/></svg>
    <div><b id="primary"></b><span id="secondary"></span></div>
  </div>
  <h1 id="title"></h1>
  <p class="meta"><i></i><span id="meta"></span></p>
</div>
</body></html>
